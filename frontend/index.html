<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basil & Ember — AI Assistant Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="chat-header">
    <h1>🔥 Basil & Ember</h1>
    <p class="tagline">AI Customer Support Assistant — Portfolio Demo Project</p>
  </header>

  <main class="chat-container">
    <div id="chat-messages" class="chat-messages">
      <!-- Messages will be added here dynamically by script.js -->
    </div>

    <form id="chat-form" class="chat-input-area">
      <input
        type="text"
        id="user-input"
        placeholder="Ask about our menu, hours, delivery..."
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
